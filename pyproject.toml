[build-system]
# Floor 1.27: first hatchling with PEP 639 (the SPDX `license = "MIT"` expression and
# `license-files`) -> Metadata-Version 2.4. Ceiling <1.32: 1.32 bumped to Metadata-Version
# 2.5, which the twine bundled in the pinned publish action does not yet recognize
# (pypa/twine#1327), failing the upload's metadata check. 2.4 is accepted by PyPI and that
# twine; lift the ceiling once the action ships a 2.5-aware twine.
requires = ["hatchling>=1.27,<1.32"]
build-backend = "hatchling.build"

[project]
name = "pydatagokr"
version = "0.2.0"
description = "Read Korean government open-data services from data.go.kr: weather, air quality, holidays, real estate, mid-range forecasts, procurement, customs trade, and KOFIA market statistics."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Seokhoon Joo", email = "seokhoonj@gmail.com" }]
keywords = ["data.go.kr", "korea", "open data", "공공데이터", "kofia", "customs", "finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
]
# No runtime dependencies on purpose: urllib and json from the standard library
# carry the whole client. A data client that never breaks on a third party's release
# is worth more than any convenience they would add. Rows come back as ``list[dict]``,
# which ``pandas.DataFrame`` / ``polars.DataFrame`` accept directly, so no DataFrame
# library is bundled or wrapped.
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/seokhoonj/pydatagokr"
Repository = "https://github.com/seokhoonj/pydatagokr"
Issues = "https://github.com/seokhoonj/pydatagokr/issues"

[project.scripts]
datagokr = "pydatagokr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pydatagokr"]

[tool.ruff]
# 100, not 88: the table specs align vendor tokens, clean columns, and Korean field
# comments on one line each, which reads better whole than wrapped.
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The table specs are aligned data tables of vendor tokens and Korean field names; a
# few rows run past the line length and read better whole than wrapped.
"src/pydatagokr/_spec.py" = ["E501"]
"src/pydatagokr/services/kofia.py" = ["E501"]
"src/pydatagokr/services/customs.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true

# Tests get the real checks but not the annotation ceremony: `-> None` on every test
# is noise. The package itself is strict without exception -- it is the part with a
# contract.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
check_untyped_defs = true
